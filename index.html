<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yusuf System</title>
    
    <!-- بەشی ناساندنی وەک ئەپ بۆ ئایفۆن و ئەندرۆید -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="یوسف مێنۆ">

    <!-- لۆگۆی ئەپەکە کاتی تثبيت کردن -->
    <link rel="apple-touch-icon" href="https://i.supaimg.com/aa375ff8-cba9-4631-9948-d2f83ef4a73b/5afaaab5-5507-4172-aad1-747d4296389d.png">
    <link rel="icon" type="image/png" href="https://i.supaimg.com/aa375ff8-cba9-4631-9948-d2f83ef4a73b/5afaaab5-5507-4172-aad1-747d4296389d.png">

    <!-- کۆدی مانێفێست بۆ ئەندرۆید و خێراکردنی ئەپەکە -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Yusuf%20Restaurant%22,%22short_name%22:%22Yusuf%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#0a0a0a%22,%22theme_color%22:%22#d4af37%22,%22icons%22:[{%22src%22:%22https://i.supaimg.com/aa375ff8-cba9-4631-9948-d2f83ef4a73b/5afaaab5-5507-4172-aad1-747d4296389d.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <style>
        :root { --gold: #d4af37; --dark: #0a0a0b; --card: rgba(255, 255, 255, 0.05); --border: rgba(212, 175, 55, 0.3); }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: #fff; margin: 0; padding: 15px; user-select: none; }
        .container { max-width: 500px; margin: auto; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid var(--border); }
        .restaurant-name { color: var(--gold); font-size: 1.8rem; font-weight: bold; margin: 0; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 25px; padding: 20px; margin-top: 20px; backdrop-filter: blur(15px); }
        h2 { color: var(--gold); font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        input { width: 110px; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 12px; color: white; text-align: center; font-size: 1.1rem; outline: none; }
        .btn { width: 100%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 10px; }
        .btn-save { background: linear-gradient(135deg, #27ae60, #1e8449); color: white; }
        .btn-final { background: linear-gradient(135deg, #8e0000, #660000); color: white; }
        .btn-nav { background: transparent; color: var(--gold); border: 1px solid var(--gold); margin-top: 20px; }
        .hidden { display: none; }
        .history-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 12px; border-right: 4px solid var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <p class="restaurant-name">خواردنگەی یوسف</p>
    </header>

    <div id="calcPage">
        <div class="card">
            <h2>🌅 بەیانی (هەویر)</h2>
            <div class="input-row"><label>کۆی هەویری لحم:</label><input type="number" id="m_l"></div>
            <div class="input-row"><label>کۆی هەویری پیتزا:</label><input type="number" id="m_p"></div>
            <button class="btn btn-save" onclick="saveMorning()">💾 سەیڤکردن</button>
        </div>

        <div class="card">
            <h2>🌙 شەو (داخستن)</h2>
            <div class="input-row"><label>ماوەی لحم:</label><input type="number" id="e_l_rem"></div>
            <div class="input-row"><label>ماوەی پیتزا:</label><input type="number" id="e_p_rem"></div>
            <div class="input-row" style="color: #61a5ff;"><label>لحمی خوراو:</label><input type="number" id="eat_l"></div>
            <div class="input-row" style="color: #61a5ff;"><label>پیتزای خوراو:</label><input type="number" id="eat_p"></div>
            <div class="input-row" style="color:#ff4757"><label>مەسروفات:</label><input type="number" id="spent"></div>
            <button class="btn btn-final" onclick="finishDay()">🏁 کۆتایی ڕۆژ</button>
        </div>
        <button class="btn btn-nav" onclick="showHistory()">📜 مێژوو</button>
    </div>

    <div id="historyPage" class="hidden">
        <button class="btn btn-nav" onclick="location.reload()">⬅️ گەڕانەوە</button>
        <div id="historyList" style="margin-top:20px;"></div>
    </div>
</div>

<script>
    function saveMorning() {
        const data = { l: document.getElementById('m_l').value, p: document.getElementById('m_p').value };
        localStorage.setItem('yusuf_morning', JSON.stringify(data));
        alert("بڕی بەیانی سەیڤ کرا");
    }

    function finishDay() {
        const morning = JSON.parse(localStorage.getItem('yusuf_morning') || '{"l":0,"p":0}');
        const l_rem = Number(document.getElementById('e_l_rem').value) || 0;
        const p_rem = Number(document.getElementById('e_p_rem').value) || 0;
        const el = Number(document.getElementById('eat_l').value) || 0;
        const ep = Number(document.getElementById('eat_p').value) || 0;
        const sp = Number(document.getElementById('spent').value) || 0;

        const soldL = Number(morning.l) - l_rem - el;
        const soldP = Number(morning.p) - p_rem - ep;
        const profit = (soldL * 1250) + (soldP * 3000) - sp;

        const record = { date: new Date().toLocaleDateString('ku-IQ'), profit: profit.toLocaleString() };
        let history = JSON.parse(localStorage.getItem('yusuf_final_db') || '[]');
        history.unshift(record);
        localStorage.setItem('yusuf_final_db', JSON.stringify(history));
        alert("قازانج: " + record.profit + " د.ع");
        localStorage.removeItem('yusuf_morning');
        location.reload();
    }

    function showHistory() {
        document.getElementById('calcPage').classList.add('hidden');
        document.getElementById('historyPage').classList.remove('hidden');
        const history = JSON.parse(localStorage.getItem('yusuf_final_db') || '[]');
        document.getElementById('historyList').innerHTML = history.map(h => `
            <div class="history-item">
                <strong>${h.date}</strong><br>قازانج: ${h.profit} د.ع
            </div>
        `).join('');
    }
</script>
</body>
</html>
