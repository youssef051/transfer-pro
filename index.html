<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خواردنگەی یوسف - سیستەمی تۆمارکردن</title>
    <style>
        :root { --gold: #d4af37; --red: #8e0000; --dark: #0a0a0b; --card: rgba(255, 255, 255, 0.05); --border: rgba(212, 175, 55, 0.3); }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        h2 { color: var(--gold); font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 0; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        input { width: 110px; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; color: white; text-align: center; font-size: 1rem; outline: none; }
        .btn { width: 100%; padding: 15px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-save { background: #27ae60; color: white; border-bottom: 4px solid #1e8449; }
        .btn-final { background: var(--red); color: white; border-bottom: 4px solid #660000; margin-top: 20px; }
        .btn-history { background: transparent; color: var(--gold); border: 1px solid var(--gold); margin-top: 15px; }
        .btn-back { background: #333; color: white; margin-bottom: 20px; }
        .hidden { display: none; }
        .history-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 15px; padding: 15px; margin-bottom: 10px; position: relative; }
        .del-btn { position: absolute; left: 15px; top: 15px; color: #ff4757; font-size: 1.2rem; cursor: pointer; }
        .profit-text { color: #2ecc71; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container" id="mainApp">
    <header style="text-align:center; padding: 20px 0;">
        <h1 style="color:var(--gold); margin:0;">خواردنگەی یوسف</h1>
        <p id="liveDate" style="color:#666; font-size: 0.9rem;"></p>
    </header>

    <!-- لاپەڕەی سەرەکی -->
    <div id="entryPage">
        <div class="card">
            <h2>🌅 بەیانیان: تۆمارکردنی هەویر</h2>
            <div class="input-row"><label>کۆی هەویری لحم:</label><input type="number" id="morning_l"></div>
            <div class="input-row"><label>کۆی هەویری پیتزا:</label><input type="number" id="morning_p"></div>
            <button class="btn btn-save" onclick="lockMorningData()">💾 سەیڤکردنی بەیانی</button>
            <p id="saveMsg" style="text-align:center; color:#2ecc71; display:none; margin-top:10px; font-size:0.8rem;"></p>
        </div>

        <div class="card">
            <h2>🌙 شەوان: داخستنی حیساب</h2>
            <div class="input-row"><label>ماوەی لحم:</label><input type="number" id="night_l_rem"></div>
            <div class="input-row"><label>ماوەی پیتزا:</label><input type="number" id="night_p_rem"></div>
            <hr style="opacity:0.1; margin:15px 0;">
            <div class="input-row"><label>لحمی خوراو:</label><input type="number" id="eat_l"></div>
            <div class="input-row"><label>پیتزای خوراو:</label><input type="number" id="eat_p"></div>
            <div class="input-row" style="color:#ff4757"><label>مەسروفات:</label><input type="number" id="daily_spent"></div>
            <button class="btn btn-final" onclick="calculateAndArchive()">🏁 تۆمارکردنی کۆتایی ڕۆژ</button>
        </div>

        <button class="btn btn-history" onclick="showHistoryPage()">📜 بینینی هەموو تۆمارەکان</button>
    </div>

    <!-- لاپەڕەی مێژوو -->
    <div id="historyPage" class="hidden">
        <button class="btn btn-back" onclick="showEntryPage()">⬅️ گەڕانەوە بۆ حیسابات</button>
        <h2 style="text-align:center;">📅 تۆمارەکانی ڕابردوو</h2>
        <div id="historyList"></div>
    </div>
</div>

<script>
    // لۆدکردنی داتا لە کاتی کردنەوە
    window.onload = function() {
        const savedMorning = localStorage.getItem('yusuf_morning_temp');
        if (savedMorning) {
            const data = JSON.parse(savedMorning);
            document.getElementById('morning_l').value = data.l;
            document.getElementById('morning_p').value = data.p;
            document.getElementById('saveMsg').style.display = 'block';
            document.getElementById('saveMsg').innerText = "✅ داتای بەیانی (کاتژمێر " + data.time + ") پارێزراوە";
        }
        document.getElementById('liveDate').innerText = new Date().toLocaleDateString('ku-IQ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    };

    function lockMorningData() {
        const l = document.getElementById('morning_l').value;
        const p = document.getElementById('morning_p').value;
        if(!l || !p) return alert("تکایە بڕی بەیانیان بنووسە");

        const morningData = { l: l, p: p, time: new Date().toLocaleTimeString('ku-IQ', { hour: '2-digit', minute: '2-digit' }) };
        localStorage.setItem('yusuf_morning_temp', JSON.stringify(morningData));
        alert("داتای بەیانی سەیڤ کرا و لێرە دەمێنێتەوە.");
        location.reload();
    }

    function calculateAndArchive() {
        const savedMorning = localStorage.getItem('yusuf_morning_temp');
        if (!savedMorning) return alert("سەرەتا دەبێت بەیانیان داتاکە سەیڤ بکەیت!");

        const morning = JSON.parse(savedMorning);
        const l_tot = Number(morning.l);
        const p_tot = Number(morning.p);
        
        const l_rem = Number(document.getElementById('night_l_rem').value) || 0;
        const p_rem = Number(document.getElementById('night_p_rem').value) || 0;
        const le = Number(document.getElementById('eat_l').value) || 0;
        const pe = Number(document.getElementById('eat_p').value) || 0;
        const spent = Number(document.getElementById('daily_spent').value) || 0;

        const total = ((l_tot - l_rem) * 1250) + ((p_tot - p_rem) * 3000) - spent;

        const record = {
            id: Date.now(),
            date: new Date().toLocaleDateString('ku-IQ', { weekday: 'short', day: 'numeric', month: 'numeric' }),
            info: `فرۆش: ${l_tot - l_rem} لحم / ${p_tot - p_rem} پیتزا`,
            eaten: `خواردن: ${(le*1250 + pe*3000).toLocaleString()}`,
            spent: spent.toLocaleString(),
            profit: total.toLocaleString()
        };

        let history = JSON.parse(localStorage.getItem('yusuf_history_v3') || '[]');
        history.unshift(record);
        localStorage.setItem('yusuf_history_v3', JSON.stringify(history));
        
        localStorage.removeItem('yusuf_morning_temp'); // پاککردنەوە بۆ سبەی
        alert("تۆمار کرا! کۆتایی حیساب: " + total.toLocaleString() + " د.ع");
        location.reload();
    }

    function showHistoryPage() {
        document.getElementById('entryPage').classList.add('hidden');
        document.getElementById('historyPage').classList.remove('hidden');
        loadHistoryItems();
    }

    function showEntryPage() {
        document.getElementById('historyPage').classList.add('hidden');
        document.getElementById('entryPage').classList.remove('hidden');
    }

    function loadHistoryItems() {
        const history = JSON.parse(localStorage.getItem('yusuf_history_v3') || '[]');
        const list = document.getElementById('historyList');
        if(history.length === 0) {
            list.innerHTML = "<p style='text-align:center; color:#666;'>هیچ تۆمارێک نییە</p>";
            return;
        }

        list.innerHTML = history.map(item => `
            <div class="history-item">
                <span class="del-btn" onclick="deleteItem(${item.id})">🗑️</span>
                <div style="color:var(--gold); font-weight:bold; margin-bottom:5px;">${item.date}</div>
                <div style="font-size:0.9rem; color:#ccc;">
                    ${item.info}<br>
                    مەسروفات: ${item.spent} | ${item.eaten}<br>
                    <span class="profit-text">کۆتایی: ${item.profit} د.ع</span>
                </div>
            </div>
        `).join('');
    }

    function deleteItem(id) {
        if(confirm('ئایا دڵنیای لە سڕینەوە؟')) {
            let history = JSON.parse(localStorage.getItem('yusuf_history_v3') || '[]');
            history = history.filter(i => i.id !== id);
            localStorage.setItem('yusuf_history_v3', JSON.stringify(history));
            loadHistoryItems();
        }
    }
</script>

</body>
</html>
